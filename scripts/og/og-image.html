<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Cabinet';
  src: url('file:///C:/Trabajo/Clientes/PortafolioBytecore/app/fonts/CabinetGrotesk-Variable.woff2') format('woff2');
  font-weight: 100 900;
}
@font-face {
  font-family: 'Switzer';
  src: url('file:///C:/Trabajo/Clientes/PortafolioBytecore/app/fonts/Switzer-Variable.woff2') format('woff2');
  font-weight: 100 900;
}
@font-face {
  font-family: 'JBMono';
  src: url('file:///C:/Trabajo/Clientes/PortafolioBytecore/app/fonts/JetBrainsMono-Medium.woff2') format('woff2');
  font-weight: 500;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #ffffff;
  font-family: 'Switzer', sans-serif;
  color: #171717;
  position: relative;
}
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(23,23,23,0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(23,23,23,0.05) 1px, transparent 1px);
  background-size: 80px 80px;
  -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 96%);
}
.frame { position: absolute; inset: 28px; box-shadow: 0 0 0 1px #e6e6e6; }
.inner { position: absolute; inset: 28px; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; }
.top { display: flex; justify-content: space-between; align-items: flex-start; }
.logo { height: 54px; }
.spec {
  font-family: 'JBMono', monospace;
  font-size: 15px; letter-spacing: 0.15em; text-transform: uppercase;
  color: #616161; padding-top: 16px;
}
.spec .rule { display:inline-block; width: 34px; height: 1px; background:#cccccc; vertical-align: middle; margin-right: 14px; }
h1 {
  font-family: 'Cabinet', sans-serif;
  font-weight: 700;
  font-size: 118px;
  line-height: 0.98;
  letter-spacing: -0.02em;
}
.brand { color: #0a33ff; }
.o-icon { display:inline-block; width: 0.72em; height: 0.72em; vertical-align: baseline; transform: translateY(0.08em); margin: 0 0.04em; }
.bottom { display: flex; justify-content: space-between; align-items: flex-end; }
.mono {
  font-family: 'JBMono', monospace;
  font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #616161;
}
.mono strong { color: #171717; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="top">
      <img class="logo" src="file:///C:/Trabajo/Clientes/PortafolioBytecore/public/logo_ico/final - LOGO 2-01.png" alt="">
      <div class="spec"><span class="rule"></span>FIG. 01 — Agencia de software · Trujillo, Perú</div>
    </div>
    <h1>Mejoramos<br>tus <span class="brand">pr<img class="o-icon" src="file:///C:/Trabajo/Clientes/PortafolioBytecore/public/logo_ico/final - LOGO 2-071.svg">cesos</span></h1>
    <div class="bottom">
      <div class="mono"><strong>árkos.com</strong></div>
      <div class="mono">Software a medida · ERPs · Apps</div>
    </div>
  </div>
</body>
</html>
