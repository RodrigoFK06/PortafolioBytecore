<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 20px; font-family: sans-serif; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        .row { display: flex; gap: 20px; align-items: center; }
        .box { padding: 10px; border: 1px solid #ccc; text-align: center; }
        .bg-light { background-color: #ffffff; }
        .bg-dark { background-color: #333333; color: white; }
        img { max-width: 300px; height: auto; border: 1px solid red; }
    </style>
</head>
<body>
    <h2>Logo Test</h2>
    <div class="container">
        <div class="row">
            <div class="box bg-light">
                <p>01 on Light</p>
                <img src="logo_ico/final - LOGO 2-01.png" alt="01">
            </div>
            <div class="box bg-dark">
                <p>01 on Dark</p>
                <img src="logo_ico/final - LOGO 2-01.png" alt="01">
            </div>
        </div>
        <div class="row">
            <div class="box bg-light">
                <p>02 on Light</p>
                <img src="logo_ico/final - LOGO 2-02.png" alt="02">
            </div>
            <div class="box bg-dark">
                <p>02 on Dark</p>
                <img src="logo_ico/final - LOGO 2-02.png" alt="02">
            </div>
        </div>
        <div class="row">
            <div class="box bg-light">
                <p>07 on Light</p>
                <img src="logo_ico/final - LOGO 2-07.png" alt="07">
            </div>
            <div class="box bg-dark">
                <p>07 on Dark</p>
                <img src="logo_ico/final - LOGO 2-07.png" alt="07">
            </div>
        </div>
        <div class="row">
            <div class="box bg-light">
                <p>08 on Light</p>
                <img src="logo_ico/final - LOGO 2-08.png" alt="08">
            </div>
            <div class="box bg-dark">
                <p>08 on Dark</p>
                <img src="logo_ico/final - LOGO 2-08.png" alt="08">
            </div>
        </div>
    </div>
</body>
</html>
